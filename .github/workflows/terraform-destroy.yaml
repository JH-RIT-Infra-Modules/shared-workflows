name: Terraform Destroy

on:
  workflow_call:
    inputs:
      target_env:
        description: 'Target environment for this workflow (e.g., dev, test, stage, prod)'
        required: false
        type: string
      confirm_destroy:
        description: 'Type "DESTROY" to confirm destruction'
        required: true
        type: string
      audit_to_log_analytics:
        description: 'Send destroy audit events to the configured Log Analytics custom table'
        required: false
        type: boolean
        default: false
      terraform_version:
        description: 'Terraform version to use'
        required: false
        type: string
        default: '1.16.2'
      tf_vars:
        description: 'JSON object of TF_VAR_ environment variables (e.g., {"foo": "bar"})'
        required: false
        type: string
        default: '{}'
      terraform_directory:
        description: 'Directory containing Terraform configuration files'
        required: false
        type: string
        default: '.'
      terraform_init_upgrade:
        description: 'Use -upgrade flag during terraform init (updates provider versions)'
        required: false
        type: boolean
        default: false
      custom_runner:
        description: 'JSON array of runner labels, for example ["self-hosted", "azure-terraform"]'
        required: false
        type: string
        default: '["self-hosted", "azure-terraform"]'
      run_without_runner_caches:
        description: 'Run build.sh without runner cache environment variables'
        required: false
        type: boolean
        default: false
      command_override:
        description: 'Additional flags to append to the primary Terraform command (e.g., "-target=module.foo")'
        required: false
        type: string
        default: ''

env:
  TF_VERSION: ${{ inputs.terraform_version }}
  TF_VAR_environment: ${{ inputs.target_env}}

jobs:
  destroy:
    name: Destroy (${{ inputs.target_env }})
    runs-on: ${{ fromJSON(inputs.custom_runner || '["ubuntu-latest"]') }}
    environment: ${{ inputs.target_env }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Display Warning
        run: |
          echo "⚠️  WARNING: Destroying infrastructure in ${{ inputs.target_env }} environment"
          echo "📁 Terraform directory: ${{ inputs.terraform_directory }}"
          echo "⚠️  This action is IRREVERSIBLE!"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run without runner caches
        if: ${{ inputs.run_without_runner_caches }}
        run: |
          env -u TF_PLUGIN_CACHE_DIR \
              -u NPM_CONFIG_CACHE \
              -u PIP_CACHE_DIR \
              -u MAVEN_OPTS \
              ./build.sh

      - name: Install Azure CLI
        run: |
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          fi
          az version

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: JH-RIT-Infra-Modules

      - name: Configure Git for Module Access
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          
      - name: Verify Backend Config Secrets
        run: |
          # Report existence of required backend secrets.
          if [ -z "${{ vars.BACKEND_RESOURCE_GROUP }}" ]; then
            echo "⚠️ BACKEND_RESOURCE_GROUP does NOT exist"
          else
            echo "✅ BACKEND_RESOURCE_GROUP exists"
          fi
          if [ -z "${{ vars.BACKEND_STORAGE_ACCOUNT }}" ]; then
            echo "⚠️ BACKEND_STORAGE_ACCOUNT does NOT exist"
          else
            echo "✅ BACKEND_STORAGE_ACCOUNT exists"
          fi
          if [ -z "${{ vars.BACKEND_CONTAINER_NAME }}" ]; then
            echo "⚠️ BACKEND_CONTAINER_NAME does NOT exist"
          else
            echo "✅ BACKEND_CONTAINER_NAME exists"
          fi
          echo "✅ Backend key: ${{ github.event.repository.name }}/${{ inputs.target_env }}.tfstate"

      - name: Set TF_VAR environment variables
        run: |
          # Process tf_vars input (only variables prefixed with TF_VAR_)
          if [ '${{ inputs.tf_vars }}' != '{}' ]; then
            # For variables prefixed with TF_VAR_, convert variable name to lowercase while keeping TF_VAR_ prefix uppercase
            echo '${{ inputs.tf_vars }}' | jq -r 'to_entries[] | select(.key | startswith("TF_VAR_")) | "TF_VAR_" + (.key[7:] | ascii_downcase) + "=" + .value' >> $GITHUB_ENV
          fi
        env:
          TF_VAR_SECRETS: ${{ toJson(secrets) }}

      - name: Set TF_VAR secrets from inherited secrets
        run: |
          # Process inherited secrets (only secrets prefixed with TF_VAR_)
          echo '${{ toJson(secrets) }}' | jq -r 'to_entries[] | select(.key | startswith("TF_VAR_")) | "TF_VAR_" + (.key[7:] | ascii_downcase) + "=" + .value' >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          UPGRADE_FLAG=""
          if [ "${{ inputs.terraform_init_upgrade }}" = "true" ]; then
            UPGRADE_FLAG="-upgrade"
          fi
          terraform init $UPGRADE_FLAG \
            $( [ -z "${{ vars.BACKEND_SUBSCRIPTION_ID }}" ] || echo -backend-config="subscription_id=${{ vars.BACKEND_SUBSCRIPTION_ID }}" ) \
            -backend-config="resource_group_name=${{ vars.BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=${{ github.event.repository.name }}/${{ inputs.target_env }}.tfstate"

      - name: Terraform Destroy Plan
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          echo "📋 Generating destroy plan for ${{ inputs.target_env }}..."
          OVERRIDE_FLAG=""
          if [ -n "${{ inputs.command_override }}" ]; then
            OVERRIDE_FLAG="${{ inputs.command_override }}"
          fi
          if [ -f "environments/${{ inputs.target_env }}.tfvars" ]; then
            terraform plan -destroy $OVERRIDE_FLAG -var-file="environments/${{ inputs.target_env }}.tfvars" -out=tfdestroy
          else
            terraform plan -destroy $OVERRIDE_FLAG -out=tfdestroy
          fi

      - name: Terraform Destroy
        id: terraform_destroy
        working-directory: ${{ inputs.terraform_directory }}
        run: |
          echo "🗑️  Executing destruction for ${{ inputs.target_env }}..."
          terraform apply -auto-approve tfdestroy
          echo "✅ Destruction complete for ${{ inputs.target_env }}"

      - name: Publish destroy audit event
        if: ${{ always() && inputs.audit_to_log_analytics }}
        env:
          AUDIT_DCR_ENDPOINT: ${{ vars.AUDIT_DCR_ENDPOINT }}
          AUDIT_DCR_IMMUTABLE_ID: ${{ vars.AUDIT_DCR_IMMUTABLE_ID }}
          AUDIT_DCR_STREAM: ${{ vars.AUDIT_DCR_STREAM }}
          AUDIT_RESULT: ${{ steps.terraform_destroy.outcome || 'skipped' }}
          GH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          set -euo pipefail

          if [ -z "$AUDIT_DCR_ENDPOINT" ] || [ -z "$AUDIT_DCR_IMMUTABLE_ID" ] || [ -z "$AUDIT_DCR_STREAM" ]; then
            echo "Log Analytics audit is enabled, but one or more AUDIT_DCR_* environment variables are missing." >&2
            exit 1
          fi

          approvals=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -c '[.[] | select(.state == "approved") | {login: .user.login, user_id: .user.id, environments: [.environments[].name]}]')

          event=$(jq -n \
            --arg timeGenerated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg action "terraform-destroy" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repositoryId "$GITHUB_REPOSITORY_ID" \
            --arg environment "$TARGET_ENV" \
            --arg initiator "$GITHUB_ACTOR" \
            --arg initiatorId "$GITHUB_ACTOR_ID" \
            --arg triggeringActor "$GH_TRIGGERING_ACTOR" \
            --arg commitSha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "$GH_RUN_URL" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg result "$AUDIT_RESULT" \
            --arg subscriptionId "$ARM_SUBSCRIPTION_ID" \
            --arg clientId "$ARM_CLIENT_ID" \
            --arg approvalsJson "$approvals" \
            '[{"TimeGenerated": $timeGenerated, "Action": $action, "Repository": $repository, "RepositoryId": $repositoryId, "Environment": $environment, "Initiator": $initiator, "InitiatorId": $initiatorId, "TriggeringActor": $triggeringActor, "CommitSha": $commitSha, "Ref": $ref, "RunId": $runId, "RunAttempt": $runAttempt, "RunUrl": $runUrl, "Workflow": $workflow, "Result": $result, "AzureSubscriptionId": $subscriptionId, "AzureClientId": $clientId, "ApprovalsJson": $approvalsJson}]')

          echo "## Deployment audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: terraform-destroy ($TARGET_ENV)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: $AUDIT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Initiated by: $GITHUB_ACTOR (GitHub ID $GITHUB_ACTOR_ID)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggering actor: $GH_TRIGGERING_ACTOR" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Approvals: $approvals" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GH_RUN_URL" >> "$GITHUB_STEP_SUMMARY"

          access_token=$(az account get-access-token --resource https://monitor.azure.com/ --query accessToken --output tsv)
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $access_token" \
            -H "Content-Type: application/json" \
            --data-binary "$event" \
            "${AUDIT_DCR_ENDPOINT%/}/dataCollectionRules/$AUDIT_DCR_IMMUTABLE_ID/streams/$AUDIT_DCR_STREAM?api-version=2023-01-01"